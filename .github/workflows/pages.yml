# Testa e publica o site no GitHub Pages a cada push na main.
# O endereço publicado (github.io hoje, domínio próprio quando configurado em Settings → Pages)
# vem do próprio GitHub Pages e é gravado nas tags de prévia do link — nada a editar ao trocar de domínio.
# Requer uma única configuração: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Instalar Playwright + Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Testes
        run: |
          node tests/cms-core.test.js
          node tests/worker.test.js
          node tests/security.test.js
          node tests/harden-firebase-config.test.js
          node tests/book-share-icons.test.js
          node tests/responsive.test.js
          node tests/share-links.test.js
          node tests/site-url-deploy.test.js
          node tests/site-cms-hydration.test.js
          node tests/admin-panel.test.js
          node tests/admin-mobile.test.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Montar site público (sem admin.html) com o endereço publicado
        run: |
          mkdir -p _site/assets
          cp index.html firebase-messaging-sw.js _site/
          cp -r images _site/
          cp assets/config.js assets/cms-core.js assets/site-cms.js _site/assets/
          node tools/set-site-url.js "${{ steps.pages.outputs.base_url }}/" _site/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
