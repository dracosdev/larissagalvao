# Publica automaticamente as regras do Firestore, sincroniza hardening Firebase/GCP
# e publica o Cloudflare Worker (R2 + Web Push) a cada push na main ou execução manual.
# Secrets no repositório (Settings → Secrets and variables → Actions):
#   - FIREBASE_SERVICE_ACCOUNT_JSON (deploy de regras e hardening Firebase/GCP)
#   - FIREBASE_FCM_SERVICE_ACCOUNT_JSON (opcional, recomendado: conta mínima só para FCM no Worker)
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
name: Publicar Infra (Firebase e Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "assets/config.js"
      - "tools/deploy-firestore-rules.js"
      - "tools/harden-firebase-config.js"
      - "worker/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Testar scripts de hardening Firebase
        run: node tests/harden-firebase-config.test.js
      - name: Publicar firestore.rules no Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: larissa-galvao-site
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Secret FIREBASE_SERVICE_ACCOUNT_JSON não configurado — pulando deploy do firestore.rules."
            exit 0
          fi
          node tools/deploy-firestore-rules.js firestore.rules
      - name: Sincronizar Authorized Domains e restrições da Web API Key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: larissa-galvao-site
        run: node tools/harden-firebase-config.js

  deploy-cloudflare-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Testar Worker e Segurança
        run: |
          node tests/worker.test.js
          node tests/security.test.js
      - name: Instalar dependências do Worker (sem segredos no ambiente)
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Publicar Cloudflare Worker e sincronizar segredo FCM
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SA_JSON: ${{ secrets.FIREBASE_FCM_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID não configurados — pulando deploy do Worker."
            exit 0
          fi
          ./node_modules/.bin/wrangler deploy --config wrangler.toml
          if [ -n "$SA_JSON" ]; then
            printf '%s' "$SA_JSON" | ./node_modules/.bin/wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON --config wrangler.toml
          else
            echo "::notice::FIREBASE_FCM_SERVICE_ACCOUNT_JSON / FIREBASE_SERVICE_ACCOUNT_JSON ausente — Web Push ficará desativado."
          fi
