# Publica automaticamente as regras do Firestore e o Cloudflare Worker (R2 + Web Push)
# a cada push na main (quando arquivos de infra mudam) ou execução manual (workflow_dispatch).
# Requer os secrets no repositório (Settings → Secrets and variables → Actions):
#   - FIREBASE_SERVICE_ACCOUNT_JSON
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
name: Publicar Infra (Firebase e Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "tools/deploy-firestore-rules.js"
      - "worker/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Publicar firestore.rules no Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: larissa-galvao-site
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Secret FIREBASE_SERVICE_ACCOUNT_JSON não configurado — pulando deploy do firestore.rules."
            exit 0
          fi
          node tools/deploy-firestore-rules.js firestore.rules

  deploy-cloudflare-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Testar Worker e Segurança
        run: |
          node tests/worker.test.js
          node tests/security.test.js
      - name: Instalar dependências do Worker (sem segredos no ambiente)
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Publicar Cloudflare Worker e sincronizar segredo FCM
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID não configurados — pulando deploy do Worker."
            exit 0
          fi
          ./node_modules/.bin/wrangler deploy --config wrangler.toml
          if [ -n "$SA_JSON" ]; then
            printf '%s' "$SA_JSON" | ./node_modules/.bin/wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON --config wrangler.toml
          else
            echo "::notice::FIREBASE_SERVICE_ACCOUNT_JSON ausente — Web Push ficará desativado até configurar o secret."
          fi
