<!doctype html>
<!-- Modelo da imagem de prévia (og:image, 1200x630). Gere de novo com: node tools/build-og-image.js -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=EB+Garamond&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#160c11}
  .bg{position:absolute;inset:0;background:url(../images/page_bg.jpg) center 4%/1200px auto no-repeat;filter:brightness(.55)}
  .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(22,12,17,.92) 0%,rgba(22,12,17,.7) 42%,rgba(22,12,17,.15) 100%)}
  .text{position:absolute;left:70px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center;color:#f0dcd5}
  h1{margin:0;font:500 78px/1 'Cormorant Garamond',serif;color:#f0dcd5}
  .role{display:flex;align-items:center;gap:14px;margin-top:14px;font:400 20px 'EB Garamond',serif;letter-spacing:9px;color:#d2a79c}
  .role:before,.role:after{content:"";width:54px;height:1px;background:#8f6c65}
  p{margin:34px 0 0;font:italic 400 30px/1.3 'Cormorant Garamond',serif;color:#e8bfb3}
  .covers{position:absolute;right:48px;top:0;bottom:0;width:600px}
  .covers img{position:absolute;width:190px;aspect-ratio:171/231;object-fit:cover;border-radius:3px;box-shadow:0 18px 40px rgba(0,0,0,.7)}
</style>
</head>
<body>
<div class="bg"></div><div class="shade"></div>
<div class="text">
  <h1>Larissa Galvão</h1>
  <div class="role">AUTORA</div>
  <p>Histórias que mergulham na mente,<br>no coração e nos lugares<br>mais sombrios da alma.</p>
</div>
<div class="covers">
  <img src="../images/cover_ruinas_parte1.jpeg" style="left:0;top:200px;width:150px;transform:rotate(-8deg);z-index:1">
  <img src="../images/cover_ruinas_parte3.jpeg" style="left:420px;top:200px;width:150px;transform:rotate(8deg);z-index:1">
  <img src="../images/cover2.jpg" style="left:90px;top:170px;width:175px;transform:rotate(-4deg);z-index:2">
  <img src="../images/cover_ruinas_parte2.jpeg" style="left:305px;top:170px;width:175px;transform:rotate(4deg);z-index:2">
  <img src="../images/cover1.jpg" style="left:185px;top:140px;width:200px;z-index:3">
</div>
</body>
</html>
