name = "larissagalvao-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Bucket R2 gratuito para fotos, capas e ícones (crie o bucket antes: wrangler r2 bucket create larissagalvao-media)
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "larissagalvao-media"

[vars]
# ID do projeto no Firebase (ex.: larissagalvao-site)
FIREBASE_PROJECT_ID = "larissa-galvao-site"
# URL pública do bucket R2 (ex.: https://pub-xxxxxxxxxxxxxxxx.r2.dev ou subdomínio próprio)
R2_PUBLIC_URL = "https://pub-f41ed604a71f4a6a9670da4c8368e363.r2.dev"
# Origens permitidas no CORS em produção (separadas por vírgula)
ALLOWED_ORIGINS = "https://larissa.zip,https://www.larissa.zip,https://admin.larissa.zip"
# E-mails super-administradores iniciais (separados por vírgula, em minúsculas)
BOOTSTRAP_ADMINS = "djmacloud@gmail.com"

[env.dev.vars]
FIREBASE_PROJECT_ID = "larissa-galvao-site"
R2_PUBLIC_URL = "https://pub-f41ed604a71f4a6a9670da4c8368e363.r2.dev"
ALLOWED_ORIGINS = "https://larissa.zip,https://www.larissa.zip,https://admin.larissa.zip,http://localhost:8080,http://127.0.0.1:8080"
BOOTSTRAP_ADMINS = "djmacloud@gmail.com"

# Segredo configurado via CLI (NUNCA coloque no arquivo):
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON
# Cole o JSON da conta de serviço do Firebase (preferencialmente restrita apenas a FCM).
